# fly.toml app configuration file generated for velo-rank-api on 2026-05-22T23:51:29+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'velo-rank-api'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3000'

# 单实例常驻：保留 WebSocket 连接，避免空闲停机与自动扩容。
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[services]]
  protocol = 'tcp'
  internal_port = 3000

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory_mb = 256
  cpus = 1
